{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>
        <p class="sub-text">
            Build your career with us
        </p>
        <form method = "POST">
            <input type = "email" name = "email" placeholder = "Enter your email" required>
            <input type = "password" name = "password" placeholder = "Create your password" required>
            <p class = "sub-text">enter atleast 6 charecters</p>
            <button type = "submit">
                Sign up
            </button>

        </form>
        <p class = "switch-auth"> Already have an account ?
            <a href="/login" class = "switch-link">Log in here</a>
        </p>
            
    </div>
</div>
{% endblock %}
